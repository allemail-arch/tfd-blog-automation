# ============================================================
# KEYWORD STRATEGY — The Founder's Dream
# ------------------------------------------------------------
# Numbers Google Keyword Planner se hain (India, Sept 2026).
# Ye file hath se edit ki ja sakti hai. Iske alawa ek aur file
# hai — keywords.auto.yaml — jo aapke apne channel aur site se
# apne aap banti hai (build_keywords.py chalane par).
#
# SABSE ZARURI NIYAM: keyword tabhi use ho jab episode us baare
# me sach me baat karta ho. Volume dekhkar zabardasti thoosna
# Google ko dikh jaata hai aur ranking girti hai.
# ============================================================

# ---- BRAND ----
# Search volume na ke barabar hai, par brand ke liye zaruri.
# Har post me 1-2 baar, natural jagah par.
brand:
  - "The Founder's Dream"
  - "TFD podcast"

# ---- HIGH-VOLUME TOPIC KEYWORDS ----
# Asli traffic yahan hai. Model in me se WAHI chunega jo us
# episode ke content se sach me match kare. Match na ho to
# chhod dega — ye jaanbujh kar hai.
high_volume:
  en:
    - term: "business ideas india"
      volume: 4400
    - term: "best business ideas in india"
      volume: 6600
    - term: "small business ideas in india"
      volume: 1900
    - term: "new business ideas in india"
      volume: 1900
    - term: "startup ideas in india"
      volume: 1600
    - term: "profitable business in india"
      volume: 1300
    - term: "trending business in india"
      volume: 1000
    - term: "best business to start in india"
      volume: 1900
  hi:
    - term: "बिजनेस आइडिया"
      volume: 4400
    - term: "छोटा बिजनेस आइडिया"
      volume: 1600
    - term: "नए बिजनेस आइडिया"
      volume: 1000
    - term: "फ्री बिजनेस आइडिया"
      volume: 880
    - term: "घरेलू महिलाओं के लिए बिजनेस आइडिया"
      volume: 720
    - term: "सबसे अच्छा बिजनेस आइडिया"
      volume: 720
    - term: "घर बैठे बिजनेस आइडिया"
      volume: 30

# ---- NICHE / BRAND-ADJACENT ----
# Volume kam hai par intent bilkul sahi hai — jo ye search karta
# hai wo exactly humara content dhoondh raha hai.
niche:
  en:
    - term: "founder podcast"
      volume: 590
    - term: "entrepreneur success story india"
      volume: 320
    - term: "successful entrepreneurs in india and their story"
      volume: 210
    - term: "indian business podcast"
      volume: 140
    - term: "business podcast india"
      volume: 110
    - term: "entrepreneur stories india"
      volume: 70
    - term: "successful business stories in india"
      volume: 50
    - term: "best business podcasts india"
      volume: 30
    - term: "success stories of women entrepreneurs in india"
      volume: 30
    - term: "startup founder interview"
      volume: 10
  hi:
    - term: "स्टार्टअप कैसे शुरू करें"
      volume: 70
    - term: "सफल बिजनेस आइडिया"
      volume: 40
    - term: "बिजनेस पॉडकास्ट हिंदी"
      volume: 0
    - term: "भारतीय उद्यमी की कहानी"
      volume: 0

# ---- LONG-TAIL TEMPLATES ----
# {founder} aur {company} run time par bhar jaate hain.
# Inka volume aaj zero hai, par jab guest ka naam search hota
# hai to post pehle number par aati hai. Ye sabse pakka traffic hai.
longtail_templates:
  en:
    - "{founder} success story"
    - "{founder} interview"
    - "{company} founder story"
    - "how {founder} built {company}"
    - "{company} business model"
  hi:
    - "{founder} की सफलता की कहानी"
    - "{founder} इंटरव्यू"
    - "{company} की शुरुआत कैसे हुई"

# ---- FALLBACK INTERNAL LINKS ----
# Ye tabhi use hote hain jab site par koi milti-julti post na mile.
# Normally automation khud related posts dhoondhkar link karta hai.
internal_links:
  - url: "https://thefoundersdream.in/"
    anchor_en: "The Founder's Dream podcast"
    anchor_hi: "द फाउंडर्स ड्रीम पॉडकास्ट"
  - url: "https://thefoundersdream.in/category/entrepreneurial-journey/"
    anchor_en: "entrepreneurial journey stories"
    anchor_hi: "उद्यमियों की कहानियाँ"
  - url: "https://thefoundersdream.in/category/self-growth/"
    anchor_en: "self growth lessons"
    anchor_hi: "सेल्फ ग्रोथ"

# ---- BANNED PHRASES ----
avoid:
  - "In today's fast-paced world"
  - "delve into"
  - "In conclusion"
  - "It is important to note"
  - "game-changer"
  - "unlock the power"
  - "navigate the landscape"
  - "testament to"

# ---- CTA ----
cta:
  en: "Watch the full conversation on [The Founder's Dream YouTube channel](https://www.youtube.com/@thefoundersdream) and subscribe for new founder interviews every week."
  hi: "पूरी बातचीत देखिए [द फाउंडर्स ड्रीम यूट्यूब चैनल](https://www.youtube.com/@thefoundersdream) पर, और हर हफ़्ते नए फाउंडर इंटरव्यू के लिए सब्सक्राइब कीजिए।"
